name: Incident de production
description: Consigner une anomalie détectée sur l'environnement de production.
title: "[Incident production] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Ne jamais joindre de secret, mot de passe, jeton, donnée personnelle, adresse privée ou export de base. Après qualification, créer ou relier une fiche versionnée `SPITY-INC-YYYY-NNNN`.
  - type: input
    id: incident_id
    attributes:
      label: Identifiant du registre
      description: Laisser vide si le signal est nouveau ; le mainteneur attribue ensuite SPITY-INC-YYYY-NNNN.
      placeholder: SPITY-INC-2026-0003
  - type: input
    id: detected_at
    attributes:
      label: Date et heure de détection
      description: Utiliser ISO 8601, Europe/Paris, et préciser la source.
      placeholder: 2026-08-13T10:30:00+02:00 - alerte GitHub Actions
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Sévérité
      options:
        - S1 - indisponibilité ou perte de données
        - S2 - fonction critique dégradée
        - S3 - fonction non critique dégradée
        - S4 - anomalie mineure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version et révision
      placeholder: 0.1.0-jury / 49c4ea0
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact, périmètre et contournement
      description: Indiquer les utilisateurs, parcours et données affectés sans donnée personnelle, ainsi que le contournement connu.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes de reproduction
      description: Donner les préconditions, étapes numérotées, résultat observé, attendu et fréquence.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Preuves anonymisées
      description: Utiliser un lien public, un chemin de dépôt, un identifiant de workflow ou une sortie strictement anonymisée.
    validations:
      required: true
  - type: textarea
    id: triage
    attributes:
      label: Triage et décision initiale
      description: Responsable, priorité, état du service, hypothèses, risque et prochaine action.
    validations:
      required: true
  - type: checkboxes
    id: confidentiality
    attributes:
      label: Contrôle de confidentialité
      options:
        - label: Je confirme que ce signal ne contient ni secret, ni donnée personnelle, ni adresse privée.
          required: true

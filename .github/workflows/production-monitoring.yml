name: Production monitoring

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      health_url:
        description: URL à contrôler, modifiable uniquement pour un exercice encadré
        required: false
        default: https://spity.fr/api/health
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: production-monitoring
  cancel-in-progress: false

jobs:
  health-check:
    name: Check public health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTH_URL: ${{ inputs.health_url || 'https://spity.fr/api/health' }}
      MONITORING_OUTPUT_PATH: .monitoring/production-health.json

    steps:
      - name: Checkout monitoring source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: spity/.nvmrc

      - name: Query production
        run: node spity/scripts/run-production-monitor.mjs

      - name: Upload monitoring evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-health-${{ github.run_id }}
          path: .monitoring/production-health.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Open or refresh production alert
        if: failure()
        uses: actions/github-script@v8
        env:
          REPORT_PATH: .monitoring/production-health.json
        with:
          script: |
            const fs = require('node:fs')
            const marker = '<!-- spity-production-monitoring -->'
            const title = '[Incident production] Supervision en échec'
            const fallback = {
              checkedAt: new Date().toISOString(),
              error: 'Le rapport de sonde est indisponible.',
              status: 'unknown',
            }
            const report = fs.existsSync(process.env.REPORT_PATH)
              ? JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'))
              : fallback
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const existing = issues.find((issue) => !issue.pull_request && issue.body?.includes(marker))
            const body = `${marker}
            La sonde publique nécessite une prise en charge selon `spity/OBSERVABILITY.md`.

            - Observé : ${report.checkedAt ?? 'indisponible'}
            - État : ${report.status ?? 'unknown'}
            - Gravité : ${report.classification?.severity ?? 'S1'}
            - Code : ${report.classification?.code ?? 'monitoring_report_missing'}
            - Impact disponibilité : ${report.availability ?? 'inconnu'}
            - Cible : ${report.target ?? 'indisponible'}
            - Run : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
            - Révision du contrôleur : ${context.sha}

            Le rapport structuré est conservé 90 jours dans l’artefact du run. Aucune réponse brute, donnée personnelle ou secret n’est copié dans cette issue.`

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
                title,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug'],
              })
            }

      - name: Close alert after recovery
        if: success()
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- spity-production-monitoring -->'
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const existing = issues.find((issue) => !issue.pull_request && issue.body?.includes(marker))

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Retour à la normale confirmé par la sonde : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              })
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
              })
            }

      - name: Record successful check
        if: success()
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from 'node:fs/promises'
          const report = JSON.parse(await readFile('.monitoring/production-health.json', 'utf8'))
          console.log('## Production health')
          console.log(`- URL: ${report.target}`)
          console.log(`- Status: ${report.status}`)
          console.log(`- Latency: ${report.indicators.latencyMs} ms (threshold ${report.indicators.maxLatencyMs} ms)`)
          console.log(`- Checked at: ${report.checkedAt}`)
          console.log(`- Evidence: production-health-${process.env.GITHUB_RUN_ID}`)
          NODE

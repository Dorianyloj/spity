services:
  mariadb:
    image: mariadb:11.4
    container_name: spity-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-spity}
      MARIADB_USER: ${MARIADB_USER:-spity}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD is required}
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: spity-phpmyadmin
    profiles: ["tools"]
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8083}:80"
    environment:
      PMA_HOST: mariadb
      PMA_USER: ${MARIADB_USER:-spity}
      PMA_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD is required}
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mariadb_data:

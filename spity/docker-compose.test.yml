name: spity-test

services:
  mariadb-test:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-spity_test}
      MARIADB_USER: ${MYSQL_USER:-spity_test}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "127.0.0.1:${MARIADB_TEST_PORT:-3307}:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

name: spity-production

services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-spity}
      MARIADB_USER: ${MARIADB_USER:-spity}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD is required}
    volumes:
      - mariadb_production_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  migrate:
    image: ${SPITY_MIGRATION_IMAGE:-spity-migrate}:${IMAGE_TAG:-local}
    build:
      context: .
      target: migration
    profiles: ["migration"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      mariadb:
        condition: service_healthy
    restart: "no"

  app:
    image: ${SPITY_IMAGE:-spity}:${IMAGE_TAG:-local}
    build:
      context: .
      target: runner
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0-local}
        APP_REVISION: ${APP_REVISION:-unknown}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      APP_VERSION: ${APP_VERSION:-0.1.0-local}
      APP_REVISION: ${APP_REVISION:-unknown}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  mariadb_production_data:
